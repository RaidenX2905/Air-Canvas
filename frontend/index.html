<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https://cdn.jsdelivr.net https://storage.googleapis.com;">
  <meta name="referrer" content="no-referrer">
  <title>Air Canvas Web</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <meta name="theme-color" content="#101116">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar Controls -->
    <header class="top-nav">
      <div class="brand">
        <svg class="logo-mark" width="22" height="22" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block; vertical-align:middle; margin-right:8px; filter: drop-shadow(0 0 6px rgba(102, 231, 255, 0.45));">
  <defs>
    <linearGradient id="nb-stroke" x1="64" y1="448" x2="448" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#66E7FF" />
      <stop offset="100%" stop-color="#F5F7FF" />
    </linearGradient>
    <filter id="nb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <path d="M 120 420 C 130 380, 210 140, 256 90 C 275 140, 320 280, 392 420" stroke="url(#nb-stroke)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 180 300 Q 256 265 345 305" stroke="url(#nb-stroke)" stroke-width="36" stroke-linecap="round" />
  <circle cx="256" cy="90" r="14" fill="#FFFFFF" filter="url(#nb-glow)" />
</svg>
        <span class="brand-title">AIR CANVAS</span>
        <span class="hw-chip active" id="hwChipActive">
          <span class="badge" id="hwBadge">PROBING...</span>
          <span id="hwActiveVal"></span>
        </span>
      </div>

      <div class="header-metrics">
        <span class="metric-item">FPS: <b id="fpsCounter">0</b></span>
        <span class="metric-item">MODE: <b id="modeIndicator" class="mode-tag idle">IDLE</b></span>
        <span class="metric-item">OBJECTS: <b id="strokeCount">0</b></span>
      </div>

      <div class="action-tools">
        <button id="btnUndo" class="tool-btn" title="Undo">Undo</button>
        <button id="btnRedo" class="tool-btn" title="Redo">Redo</button>
        <button id="btnClear" class="tool-btn danger" title="Clear Canvas">Clear</button>
        <button id="btnFullscreen" class="tool-btn" title="Toggle Fullscreen">Fullscreen</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="viewport" id="viewport">
      <!-- Hidden Video Element for Camera Stream -->
      <video id="webcam" autoplay playsinline muted></video>

      <div class="canvas-wrapper" id="canvasWrapper">
        <!-- Layer 1: Background Webcam Canvas -->
        <canvas id="cameraCanvas"></canvas>

        <!-- Layer 2: Vector Drawing Ink Canvas -->
        <canvas id="paintCanvas"></canvas>

        <!-- Layer 3: Cyberpunk Hand Skeleton & Reticle HUD Layer -->
        <canvas id="overlayCanvas"></canvas>
      </div>

      <!-- Loading / Camera Initialization Overlay -->
      <div id="loaderOverlay" class="loader-overlay">
        <div class="spinner"></div>
        <div id="loaderText">Initializing In-Browser Hand Tracker...</div>
        <div class="loader-sub">Loading MediaPipe WebAssembly vision model locally</div>
      </div>
    </main>

    <!-- Bottom Interactive Control Dock -->
    <footer class="control-dock">
      <div class="dock-section">
        <label for="cameraSelect">Camera</label>
        <select id="cameraSelect" class="dock-select">
          <option value="">Detecting...</option>
        </select>
      </div>

      <div class="dock-divider"></div>

      <!-- Compute Device Selection (Auto by default with manual override) -->
      <div class="dock-section">
        <label for="deviceSelect">Processor</label>
        <select id="deviceSelect" class="dock-select">
          <option value="AUTO" selected>Auto (Optimal)</option>
          <option value="dGPU">dGPU (High Perf)</option>
          <option value="iGPU">iGPU (Hardware Accel)</option>
          <option value="CPU">CPU (WASM Fallback)</option>
        </select>
      </div>

      <div class="dock-divider"></div>

      <!-- Color Palette -->
      <div class="dock-section">
        <label>Palette</label>
        <div class="palette-swatches" id="paletteContainer">
          <!-- Dynamically populated from JS -->
        </div>
        <input type="color" id="customColorPicker" value="#ff0000" title="Custom Color">
      </div>

      <div class="dock-divider"></div>

      <!-- Brush Size Slider -->
      <div class="dock-section">
        <label>Brush: <span id="brushSizeVal">6px</span></label>
        <input type="range" id="brushSlider" min="1" max="24" value="6" class="dock-slider">
      </div>

      <div class="dock-divider"></div>

      <!-- Eraser Size Slider -->
      <div class="dock-section">
        <label>Eraser: <span id="eraserSizeVal">36px</span></label>
        <input type="range" id="eraserSlider" min="15" max="80" value="36" class="dock-slider">
      </div>

      <div class="dock-divider"></div>

      <!-- Gestures Quick Guide -->
      <div class="dock-section hints">
        <span><b>Index:</b> Draw</span>
        <span><b>Pinch:</b> Move</span>
        <span><b>Fist:</b> Erase</span>
      </div>
    </footer>
  </div>

  <script src="canvas_engine.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
